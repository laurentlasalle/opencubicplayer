name: macOS build

on:
  release:
    types: [published]    # publish a release (tag v<upstream>-omni.<n>) on GitHub to build and attach the zip
  push:
    branches: [dev]       # test builds of the dev branch (suffix set in VERSION_SUFFIX below)
  workflow_dispatch:      # manual build, zip available as an artifact
    inputs:
      suffix:
        description: 'Version suffix for test builds, e.g. -test4 (empty for a release)'
        required: false
        default: ''

jobs:
  build:
    runs-on: macos-15     # Apple Silicon, Xcode 16 (upstream code needs a recent clang)
    permissions:
      contents: write
    env:
      WORK: ${{ github.workspace }}/.work
      VERSION_SUFFIX: ${{ github.event_name == 'push' && '-test4' || github.event.inputs.suffix }}
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build and package
        id: package
        shell: bash
        run: |
          macos/build-macos.sh | tee "$RUNNER_TEMP/build.txt"
          echo "zip=$(tail -1 "$RUNNER_TEMP/build.txt")" >> "$GITHUB_OUTPUT"
          echo "::notice title=bundle::$(grep -E '^(bundled|plugins|launch test)' "$RUNNER_TEMP/build.txt" | tr '\n' ' ')"

      - name: Logs on failure
        if: failure()
        shell: bash
        run: |
          # also as annotations, readable without signing in
          for f in "$RUNNER_TEMP/build.txt" $(ls -t .work/build/*.log 2>/dev/null | head -2); do
            test -f "$f" || continue
            echo "::error title=$(basename $f)::$(tail -n 40 "$f" | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: ocp-macos-arm64
          path: ${{ steps.package.outputs.zip }}

      - name: Publish release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.package.outputs.zip }}
