name: Windows x64 build

on:
  release:
    types: [published]    # publish a release (tag v<upstream>-omni.<n>) on GitHub to build and attach the zip
  workflow_dispatch:      # manual build, zip available as an artifact

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      WORK: ${{ github.workspace }}/.work   # absolute path without "..", required by upload-artifact
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake autoconf automake libtool pkg-config xa65 bsdextrautils zip unzip xz-utils python3

      - name: Cache toolchain and dependencies
        uses: actions/cache@v4
        with:
          path: |
            .work/tc
            .work/src
            .work/prefix
          key: deps-${{ hashFiles('windows/config.sh', 'windows/fetch-sources.sh', 'windows/build-deps.sh') }}

      - name: Fetch sources
        run: windows/fetch-sources.sh

      - name: Build dependencies
        run: windows/build-deps.sh

      - name: Build OCP
        run: windows/build-ocp.sh

      - name: Package
        id: package
        run: echo "zip=$(windows/package.sh | tail -1)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ocp-win64
          path: ${{ steps.package.outputs.zip }}

      - name: Publish release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.package.outputs.zip }}
