name: Windows x64 build

on:
  release:
    types: [published]    # publish a release (tag v<upstream>-omni.<n>) on GitHub to build and attach the zip
  push:
    branches: [dev]       # test builds of the dev branch (suffix set in VERSION_SUFFIX below)
  workflow_dispatch:      # manual build, zip available as an artifact
    inputs:
      suffix:
        description: 'Version suffix for test builds, e.g. -test1 (empty for a release)'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      WORK: ${{ github.workspace }}/.work   # absolute path without "..", required by upload-artifact
      VERSION_SUFFIX: ${{ github.event_name == 'push' && '-test5' || github.event.inputs.suffix }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake autoconf automake libtool pkg-config xa65 bsdextrautils zip unzip xz-utils python3

      - name: Cache toolchain and dependencies
        uses: actions/cache@v4
        with:
          path: |
            .work/tc
            .work/src
            .work/prefix
          key: deps-${{ hashFiles('windows/config.sh', 'windows/fetch-sources.sh', 'windows/build-deps.sh') }}

      - name: Fetch sources
        run: windows/fetch-sources.sh

      - name: Build dependencies
        run: windows/build-deps.sh

      - name: Build OCP
        run: windows/build-ocp.sh

      - name: Package
        id: package
        run: echo "zip=$(windows/package.sh | tail -1)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.package.outputs.zip }}
          archive: false  # the zip itself (named after the file), not a zip holding the zip

      - name: Publish release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.package.outputs.zip }}
